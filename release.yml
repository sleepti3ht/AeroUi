name: Build and Release Aero

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Aero executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name Aero `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --collect-all customtkinter `
            --hidden-import PIL `
            --hidden-import pystray `
            main.py

      - name: Verify release executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Aero.exe")) {
            throw "Aero.exe was not created."
          }

          $file = Get-Item "dist/Aero.exe"

          if ($file.Length -le 0) {
            throw "Aero.exe is empty."
          }

          Write-Host "Aero.exe size: $($file.Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aero-Windows
          path: dist/Aero.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Aero ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Aero.exe